[mod-setting-description]
warp-starting-grace-period=A period with no extra pollution which you can use for setting up your defenses or mining. This period happens one time at the start of the game.
warp-repeated-grace-period=A period with no extra pollution which you can use for setting up your defenses or mining. This period happens at the beginning of every new warpzone.
warp-starter-chest=When starting a new game, receive a chest of helpful free start items. Recommended in single player. 

[technology-name]
warp-remote-warp=Initiate warps remotely
warp-remote-floor=Teleport between floors remotely
warp-remote-home=Teleport to platform remotely

warp-reactor-reassembly1=Warp Reactor duct taping

[technology-description]
warp-remote-warp=Allows you to initiate warps with the Warp Reactor's remote control. Must be standing in or on the Warp Platform.
warp-remote-floor=Allows you to teleport between floors with the Warp Reactor's remote control. Must be standing in or on the Warp Platform.
warp-remote-home=Allows you to teleport back to the Warp Platform with the Warp Reactor's remote control. Automatically teleports you home before using the warp or floor teleport functions.

warp-reactor-reassembly1=Patch a few holes in the Warp Reactor with whatever you have to hand. Increases the autowarp timer by 10 minutes to 30 minutes.

